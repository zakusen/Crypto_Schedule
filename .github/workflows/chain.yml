name: Chain ledger
# v222: 資金の台帳を作る(手で動かす)。結果は成果物 x_out(chain-<事案>.json / .md)
# v223: /posts.html に手動投稿の下書き(資金の追跡)も置く。自動では投稿しない
on:
  workflow_dispatch:
    inputs:
      case:
        description: '事案(bybit2025 / binance2026)'
        default: 'bybit2025'
      hours:
        description: '発生から何時間分'
        default: '24'
      depth:
        description: '何段先までたどるか'
        default: '5'
      max:
        description: '調べるアドレスの上限'
        default: '500'
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build ledger
        run: node tools/chain-ledger.mjs --case "${{ github.event.inputs.case }}" --hours "${{ github.event.inputs.hours }}" --depth "${{ github.event.inputs.depth }}" --max "${{ github.event.inputs.max }}"
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          RX_ADMIN_KEY: ${{ secrets.RX_ADMIN_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
      - name: Save
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-${{ github.event.inputs.case }}
          path: x_out/
