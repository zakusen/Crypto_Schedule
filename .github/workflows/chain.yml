name: Chain ledger
# v222: 資金の台帳を作る。結果は成果物 x_out(chain-<事案>.json / .md / track-<事案>.json)
# v232: そのあと、ほかの EVM チェーン(Arbitrum・Avalanche・BNB・Base・Optimism・Polygon)も、Ethereum で見つけた起点から探す
# v233: Bitcoin も mempool.space(キー不要)で探す
# v230: 1時間おきに自動で binance2026 を回し、/track.html のまとめ(/api/track)を新しくする。
#        /posts.html の下書きは、手で動かして draft を 1 にした時だけ置く
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      case:
        description: '事案(bybit2025 / binance2026)'
        default: 'binance2026'
      hours:
        description: '発生から何時間分'
        default: '168'
      depth:
        description: '何段先までたどるか'
        default: '5'
      max:
        description: '調べるアドレスの上限'
        default: '500'
      draft:
        description: '/posts.html に下書きを置く(1 = 置く)'
        default: '0'
concurrency:
  group: chain-${{ github.event.inputs.case || 'binance2026' }}
  cancel-in-progress: false
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build ledger
        run: node tools/chain-ledger.mjs --case "${{ github.event.inputs.case || 'binance2026' }}" --hours "${{ github.event.inputs.hours || '168' }}" --depth "${{ github.event.inputs.depth || '5' }}" --max "${{ github.event.inputs.max || '500' }}" --draft "${{ github.event.inputs.draft || '0' }}"
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          RX_ADMIN_KEY: ${{ secrets.RX_ADMIN_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
      - name: Other EVM chains
        if: always()
        run: |
          C="${{ github.event.inputs.case || 'binance2026' }}"
          [ -f "x_out/seeds-$C.txt" ] || { echo "起点が無いので飛ばします"; exit 0; }
          CHAINS=$(node -e "import('./tools/chain/cases.mjs').then(m=>console.log((m.CASES['$C'].chains||[]).join(' ')))")
          for ch in $CHAINS; do
            echo "=== chain $ch ==="
            node tools/chain-ledger.mjs --case "$C" --chain "$ch" --seeds "$(cat x_out/seeds-$C.txt)" --hours "${{ github.event.inputs.hours || '168' }}" --depth 4 --max 200 || echo "chain $ch は失敗(無料の範囲で使えないチェーンの可能性)"
          done
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          RX_ADMIN_KEY: ${{ secrets.RX_ADMIN_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
      - name: Bitcoin
        if: always()
        run: node tools/chain-btc.mjs --case "${{ github.event.inputs.case || 'binance2026' }}" || echo "Bitcoin は失敗"
        env:
          RX_ADMIN_KEY: ${{ secrets.RX_ADMIN_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
      - name: Save
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain-${{ github.event.inputs.case || 'binance2026' }}
          path: x_out/
          retention-days: 3
