name: RX runner
# 過去の反応(EVENT IMPACT)の計算。Cloudflare の Worker からは Binance に断られる(403)ので、GitHub 側で計算してサイトへ書き戻す。
# 手で動かす: Actions → 「RX runner」→ Run workflow(最初の1回は手で動かすと、過去分がまとめて入る)
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
concurrency:
  group: rx-runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run
        run: node tools/rx_runner.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          RX_ADMIN_KEY: ${{ secrets.RX_ADMIN_KEY }}
