name: RX runner
# 過去の反応(EVENT IMPACT)の計算。Cloudflare の Worker からは Binance に断られる(403)ので、GitHub 側で計算してサイトへ書き戻す。
# 手で動かす: Actions → 「RX runner」→ Run workflow(最初の1回は手で動かすと、過去分がまとめて入る)
# v81: 最後に X 投稿の下書きづくり(tools/x_notify.mjs)も動かす。1日3回で足りる(下書きは30日先まで、発表後の値動きは /posts.html が時刻どおりに作る)。
on:
  schedule:
    - cron: '23 6,14,22 * * *'   # 1日3回(日本時間 7:23・15:23・23:23)。GitHub の時刻は UTC
  workflow_dispatch:
concurrency:
  group: rx-runner
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run
        run: node tools/rx_runner.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          RX_ADMIN_KEY: ${{ secrets.RX_ADMIN_KEY }}
      - name: X notify
        if: always()
        run: node tools/x_notify.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          RX_ADMIN_KEY: ${{ secrets.RX_ADMIN_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
