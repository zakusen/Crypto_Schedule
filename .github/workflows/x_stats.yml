name: X stats (投稿の数字を取る)
# v332→v338: 自分の X 投稿のビュー・いいねを X API で取って集計する。
#   手で動かす: Actions → 「X stats」→ Run workflow。結果は実行画面の Summary と、成果物 x_stats(stats.csv / stats.json)。
#   毎日 23:55(日本時間)に、フォロワー数だけを記録する(X API は1件読むだけ。投稿は読まない)。
#   SITE_URL・RX_ADMIN_KEY があると、フォロワー数をサイトにためて、自動投稿の下書きとも突き合わせる。
on:
  schedule:
    - cron: '55 14 * * *'   # 14:55 UTC = 23:55 日本時間
  workflow_dispatch:
    inputs:
      days:
        description: '何日前までの投稿を取るか(1〜60)'
        default: '14'
      max:
        description: '最大何件取るか(10〜1000。多いほど費用がかかる)'
        default: '200'
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get stats
        run: node tools/x_stats.mjs
        env:
          FOLLOWERS_ONLY: ${{ github.event_name == 'schedule' && '1' || '0' }}
          STATS_DAYS: ${{ github.event.inputs.days }}
          STATS_MAX: ${{ github.event.inputs.max }}
          SITE_URL: ${{ secrets.SITE_URL }}
          RX_ADMIN_KEY: ${{ secrets.RX_ADMIN_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: x_stats
          path: x_stats/
