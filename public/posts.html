<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CSA POSTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
/* v81: X 投稿の管理(運営者だけ)。カレンダーで「いつ・何を・済んだか」を見て、クリックで投稿/予約する */
:root{--bg:#0a0e16;--panel:#111725;--panel2:#0d1320;--line:#1f2a3d;--tx:#e6e9ef;--mut:#8a94a7;--gold:#c9b37e;--cyan:#7fc8d8;--up:#5fa88a;--dn:#c2645f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "IBM Plex Sans","Noto Sans JP",system-ui,sans-serif}
button{font:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(10,14,22,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;align-items:center}
header h1{margin:0;font:600 13px "IBM Plex Mono",monospace;letter-spacing:.18em;color:var(--gold)}
.sp{flex:1}
.chip{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--tx);border-color:var(--mut)}
.chip.on{color:var(--bg);background:var(--cyan);border-color:var(--cyan)}
main{max-width:1320px;margin:0 auto;padding:18px 20px 80px}
h2{font-size:15px;margin:0 0 10px;color:var(--gold);display:flex;align-items:center;gap:8px}
/* 今やること */
#todo{display:grid;gap:8px;margin-bottom:22px}
.task{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:10px;padding:12px 16px;cursor:pointer}
.task:hover{border-color:var(--mut)}
.task .ic{font-size:22px;width:30px;text-align:center}
.task .tt{font-weight:600}
.task .sub{font-size:12px;color:var(--mut)}
.task .go{margin-left:auto}
.task.now{border-left-color:var(--cyan);background:#0f1d27}
.task.warn{border-left-color:var(--dn);background:#22141a}
.task.plan{border-left-color:var(--gold)}
.task.wait{cursor:default;opacity:.8}
.btn{border:1px solid var(--line);background:#16203a;color:var(--tx);border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.main{background:var(--gold);color:#14110a;border-color:var(--gold);font-weight:700}
.btn.cy{background:var(--cyan);color:#06222a;border-color:var(--cyan);font-weight:700}
/* カレンダー */
.calbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.calbar h2{white-space:nowrap}
.calbar .ym{font-size:20px;font-weight:700;min-width:150px;text-align:center}
.legend{margin-left:auto;display:flex;gap:4px 12px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.dow{background:var(--panel2);text-align:center;font-size:12px;color:var(--mut);padding:6px 0;font-weight:600}
.dow.sat{color:#7fa6d8}.dow.sun{color:#d88a7f}
.cell{background:var(--panel);min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px}
.cell.out{background:#0c111b}
.cell.out .dn{opacity:.4}
.cell.past{background:#0e1420}
.cell.today{box-shadow:inset 0 0 0 2px var(--gold)}
.dn{font:600 13px "IBM Plex Mono",monospace;color:var(--mut);display:flex;justify-content:space-between}
.cell.today .dn{color:var(--gold)}
.ev{display:flex;align-items:center;gap:5px;font-size:12px;line-height:1.3;border-radius:6px;padding:4px 6px;cursor:pointer;border:1px solid var(--line);background:#141c2e;color:var(--tx);text-align:left;width:100%}
.ev:hover{border-color:var(--mut)}
.ev .t{font:600 11px "IBM Plex Mono",monospace;color:var(--mut)}
.ev .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ev .s{font-size:11px;flex:none}
.ev.todo{border-color:var(--gold);color:var(--tx)}
.ev.todo .s{color:var(--gold)}
.ev.ready{border-color:var(--cyan);background:#0f2430;animation:pulse 1.6s infinite}
.ev.ready .s{color:var(--cyan)}
.ev.done{background:#13261f;border-color:#2c5a46}
.ev.done .s{color:var(--up)}
.ev.wait{opacity:.75;border-style:dashed}
.ev.warn{border-color:var(--dn);background:#2a1519}
.ev.warn .s{color:var(--dn)}
.ev.missed{opacity:.5}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(127,200,216,.0)}50%{box-shadow:0 0 0 3px rgba(127,200,216,.25)}}
/* 詳細(モーダル) */
#ov{position:fixed;inset:0;background:rgba(3,6,12,.72);z-index:40;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 16px}
#ov.on{display:flex}
.md{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(1200px,100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh .k{font-size:13px;color:var(--gold);font-weight:700}
.mh .w{font-size:18px;font-weight:700}
.mh .x{margin-left:auto;display:flex;gap:6px}
.when{display:flex;align-items:center;gap:14px;padding:14px 18px;background:#0f1726;border-bottom:1px solid var(--line);flex-wrap:wrap}
.calicon{width:60px;height:70px;border-radius:9px;background:#f4efe3;color:#1a1a1a;display:flex;flex-direction:column;align-items:center;overflow:hidden;flex:none;box-shadow:0 2px 0 #b8ac8e}
.calicon .m{background:var(--dn);color:#fff;width:100%;text-align:center;font-size:11px;font-weight:700;padding:2px 0}
.calicon .d{font:700 26px/1.1 "IBM Plex Sans",sans-serif;margin-top:3px}
.calicon .w{font-size:10px;color:#555}
.when .big{font:700 26px "IBM Plex Mono","Noto Sans JP",monospace}
.when .lab{font-size:12px;color:var(--mut)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.step{font-size:12px;background:#16203a;border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--mut)}
.step b{color:var(--gold);margin-right:4px}
.warnbox{margin:14px 18px 0;padding:12px 14px;border:1px solid var(--dn);background:#2a1519;border-radius:10px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.panes{display:grid;grid-template-columns:1fr 1fr}
.pane{padding:14px 18px;min-width:0}
.pane+.pane{border-left:1px solid var(--line)}
@media (max-width:860px){.panes{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}.cell{min-height:90px}.ev .n{display:none}}
.lang{font:600 12px "IBM Plex Mono",monospace;color:var(--cyan);letter-spacing:.1em;display:flex;justify-content:space-between;margin-bottom:8px}
.lang .over{color:var(--dn)}
.pane img{width:100%;aspect-ratio:16/9;display:block;border-radius:8px;border:1px solid var(--line);background:#000;cursor:grab}
pre{white-space:pre-wrap;word-break:break-word;margin:10px 0;font:13px/1.45 "IBM Plex Sans","Noto Sans JP",sans-serif;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:230px;overflow:auto}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut);margin-left:auto;cursor:pointer;padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-weight:600}
label.ck input{width:22px;height:22px;accent-color:var(--up)}
label.ck.on{color:var(--up);border-color:var(--up);background:#13261f}
.empty{color:var(--mut);text-align:center;padding:48px 16px}
.keybox input{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px 12px;width:min(340px,100%);font:inherit}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#e6e9ef;color:#0a0e16;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center;z-index:60}
#toast.on{opacity:1}
.kbd{font:600 11px "IBM Plex Mono",monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>CSA POSTS</h1>
  <span class="sp"></span>
  <button class="chip" id="bell">🔔 通知をオンにする</button>
  <button class="chip" id="pastBtn" title="発表済みの指標の「発表後の値動き」を今つくる(手で投稿)">＋ 過去の発表から作る</button>
  <button class="chip" id="reload">↻ 更新</button>
  <button class="chip" id="keyBtn">鍵</button>
</header>
<main id="main"><div class="empty">読み込み中…</div></main>
<div id="ov"><div class="md" id="md"></div></div>
<div id="toast"></div>
<script type="module">
'use strict';
import * as L from './xpost-lib.js';
const $ = (s, r = document) => r.querySelector(s);
const KEYNAME = 'csa-admin';
const getKey = () => { try { return localStorage.getItem(KEYNAME) || ''; } catch (_) { return ''; } };
const setKey = (v) => { try { v ? localStorage.setItem(KEYNAME, v) : localStorage.removeItem(KEYNAME); } catch (_) {} };
const MOBILE = matchMedia('(pointer:coarse)').matches;
const SITE = location.origin;
const BASES = ['https://data-api.binance.vision', 'https://api.binance.com', 'https://api1.binance.com'];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// v82: 共有用の投稿画面(intent)では予約投稿が効かないので、普段の投稿画面を本文入りで開く
const intent = (t) => 'https://x.com/compose/post?text=' + encodeURIComponent(t);
function toast(t, ms = 2800) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), ms); }
const WJA = ['日', '月', '火', '水', '木', '金', '土'];
const jd = (t) => new Date(t + L.JST);
const fmtDT = (t) => { const d = jd(t); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${WJA[d.getUTCDay()]}) ${L.hm(t)}`; };
const left = (ms) => { if (ms <= 0) return 'まもなく'; const m = Math.round(ms / 6e4); if (m < 60) return `あと${m}分`; const h = Math.floor(m / 60); if (h < 24) return `あと${h}時間${m % 60 ? (m % 60) + '分' : ''}`; return `あと${Math.floor(h / 24)}日${h % 24 ? (h % 24) + '時間' : ''}`; };

import { drawPost } from './xpost-draw.js';   // v94: 画像の描き方は共通部品へ
const IMG = new Map();   // id:lang:h -> {url, blob, file}
async function image(p, lg) {
  const key = p.id + ':' + lg + ':' + (p.h || '');
  if (IMG.has(key)) return IMG.get(key);
  const cv = await drawPost(p, lg); if (!cv) return null;
  const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
  const name = `csa-${p.id.replace(/[^a-z0-9-]+/gi, '-')}-${lg}.png`;
  const o = { blob, url: URL.createObjectURL(blob), file: new File([blob], name, { type: 'image/png' }), name };
  IMG.set(key, o); return o;
}

// ---------- データ ----------
let RAWCAL = { events: [] }, POSTS = [], EVENTS = [], ITEMS = [], VIEW = null, OPEN = null, OPENUPD = false, READY = false;
async function api(body) {
  const r = await fetch('/api/admin/posts', { method: body ? 'POST' : 'GET', headers: { 'x-admin-key': getKey(), ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  if (r.status === 401) throw new Error('401');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function keyForm(msg) {
  READY = false;
  $('#main').innerHTML = `<div class="empty keybox"><p>${msg || '管理キー(RX_ADMIN_KEY)を入れてください。この端末にだけ保存されます。'}</p>
    <p><input id="keyIn" type="password" autocomplete="off" placeholder="管理キー"> <button class="btn main" id="keySave">保存</button></p></div>`;
  $('#keySave').onclick = () => { setKey($('#keyIn').value.trim()); load(); };
  $('#keyIn').onkeydown = (e) => { if (e.key === 'Enter') $('#keySave').click(); };
}
async function load() {
  if (!getKey()) return keyForm();
  try {
    const [p, c] = await Promise.all([api(), fetch('/api/cal', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({ events: [] }))]);
    POSTS = p.posts || []; RAWCAL = c; EVENTS = L.pickEvents(c);
  } catch (e) { return e.message === '401' ? keyForm('管理キーが違います。入れ直してください。') : ($('#main').innerHTML = `<div class="empty">読み込めませんでした(${esc(e.message)})</div>`); }
  READY = true; build(); render(); tick();
}

// 予定(下書き)と、まだ下書きの無い「発表後の値動き」をひとつの並びにする
const LABEL = { daily: '今日・今週の予定', arch: '発表後の値動き', week: '週間記録', spike: '急変動(S&P500相関)' };   // v95: spike
const ICON = { daily: '🗓', arch: '📈', week: '📊', spike: '⚡' };
const dueOf = (p) => p.due || (p.sr === 'daily' ? L.dayStart(p.at) + L.DAILY_AT : p.at);
function build() {
  // v85: その日にもその週の残りにも予定が無い「今日・今週の予定」は出さない(自動作成側も作らないが、作成済みの古い下書きをすぐ隠す)
  const satEmpty = (p) => p.sr === 'daily' && !(p.img && p.img.today && p.img.today.length) && !(p.img && p.img.week && p.img.week.length) && !(p.done && (p.done.en || p.done.ja));
  const by = new Map(POSTS.filter((p) => LABEL[p.sr] && !satEmpty(p)).map((p) => [p.id, p]));
  const items = [...by.values()].map((p) => ({ id: p.id, sr: p.sr, due: dueOf(p), post: p }));
  for (const g of L.groups(EVENTS.filter(L.MAJOR))) {                     // これからの主要指標(下書きはまだ無い)
    const id = L.archId(g);
    if (by.has(id)) { by.get(id)._g = g; continue; }
    items.push({ id, sr: 'arch', due: g[0].ts + L.ARCH_WAIT, g, post: null });
  }
  ITEMS = items.sort((a, b) => a.due - b.due);
}
const isDone = (p) => !!(p && p.done && p.done.en && p.done.ja);
// 状態: done(済) / warn(予約後に変更) / ready(今投稿できる) / todo(予約・投稿待ち) / wait(時刻待ち) / missed(過ぎた・作れなかった)
function stateOf(it, now = Date.now()) {
  const p = it.post;
  if (p && p.upd) return 'warn';
  if (isDone(p)) return 'done';
  if (it.sr === 'daily') return it.due >= now ? 'todo' : it.due + 14 * L.H > now ? 'ready' : 'missed';   // 予約しそびれた今日の分は、その日のうちならすぐ投稿
  if (!p) return it.due <= now ? (now - it.due < 48 * L.H ? 'ready' : 'missed') : 'wait';
  return it.due <= now ? 'ready' : 'todo';
}
const AUTO = (it) => L.isAuto({ sr: it.sr, due: it.due, man: it.post && it.post.man });   // v101: man = 手で作った下書き(自動投稿しない)   // v94: X API で自動投稿されるもの
const STXT = { done: (sr) => sr === 'daily' ? '✔ 予約済' : '✔ 済', warn: () => '⚠ 要修正', ready: () => '● 今', todo: (sr) => sr === 'daily' ? '未予約' : '待ち', wait: () => '発表待ち', missed: () => '時刻過ぎ' };
const stxt = (it, s) => AUTO(it) && s !== 'done' && s !== 'missed' ? '🤖 自動' : STXT[s](it.sr);
const shortName = (it) => it.sr === 'daily' ? '予定' : it.sr === 'week' ? '週間記録' : it.sr === 'spike' ? '急変動 ' + ((it.post && it.post.img && it.post.img.hit) || []).join('・') : (it.post ? (it.post.img && it.post.img.ja) : L.groupLine(it.g, 'ja'));

// ---------- 画面 ----------
function render() {
  const now = Date.now();
  if (!VIEW) { const d = jd(now); VIEW = { y: d.getUTCFullYear(), m: d.getUTCMonth() }; }
  // 今やること
  const T = [];
  for (const it of ITEMS) { const s = stateOf(it, now); if (s === 'warn') T.push({ cls: 'warn', ic: '⚠', tt: `${LABEL[it.sr]} ${fmtDT(it.due)} — 予約した後に予定が変わりました`, sub: 'Xの予約を消して、新しい内容で予約し直してください', id: it.id, go: '直す' }); }
  for (const it of ITEMS) { const s = stateOf(it, now); if (s === 'ready' && !AUTO(it)) T.push({ cls: 'now', ic: ICON[it.sr], tt: `今すぐ投稿: ${LABEL[it.sr]}${it.sr === 'arch' ? ' — ' + shortName(it) : ''}`, sub: `投稿時刻 ${fmtDT(it.due)}${it.post ? '' : '(価格を取得中…)'}`, id: it.id, go: '投稿する' }); }
  const plan = ITEMS.filter((it) => it.sr === 'daily' && !AUTO(it) && stateOf(it, now) === 'todo' && it.due < now + 8 * L.DAY);
  if (plan.length) T.push({ cls: 'plan', ic: '🗓', tt: `予約がまだの「今日・今週の予定」 ${plan.length}件(${fmtDT(plan[0].due).split(' ')[0]}〜${fmtDT(plan[plan.length - 1].due).split(' ')[0]})`, sub: '順番に開いて、Xで 9:30 に予約していきます', id: plan[0].id, go: '順番に予約する' });
  const nx = ITEMS.find((it) => it.sr !== 'daily' && stateOf(it, now) === 'wait');
  if (nx) T.push({ cls: 'wait', ic: '⏳', tt: `次の値動き投稿: ${shortName(nx)}(発表 ${fmtDT(nx.g ? nx.g[0].ts : nx.due - L.ARCH_WAIT)})`, sub: `投稿は ${fmtDT(nx.due)} ・ ${left(nx.due - now)}。時刻になるとこのページが下書きを作ります(このタブを開いたままに)` });
  if (!T.length) T.push({ cls: 'wait', ic: '✔', tt: '今やることはありません', sub: '' });
  // カレンダー(月曜はじまり)
  const first = Date.UTC(VIEW.y, VIEW.m, 1) - L.JST, start = L.weekStart(first);
  const nextM = Date.UTC(VIEW.y, VIEW.m + 1, 1) - L.JST, weeks = Math.ceil((nextM - start) / (7 * L.DAY));
  const today = L.dayStart(now);
  let cells = ['月', '火', '水', '木', '金', '土', '日'].map((w, i) => `<div class="dow ${i === 5 ? 'sat' : i === 6 ? 'sun' : ''}">${w}</div>`).join('');
  for (let i = 0; i < weeks * 7; i++) {
    const day = start + i * L.DAY, d = jd(day), out = d.getUTCMonth() !== VIEW.m;
    const its = ITEMS.filter((it) => it.due >= day && it.due < day + L.DAY);
    cells += `<div class="cell ${out ? 'out' : ''} ${day < today ? 'past' : ''} ${day === today ? 'today' : ''}"><div class="dn"><span>${d.getUTCDate()}</span>${day === today ? '<span>今日</span>' : ''}</div>
      ${its.map((it) => { const s = stateOf(it, now); return `<button class="ev ${s}" data-open="${esc(it.id)}" title="${esc(LABEL[it.sr] + ' ' + fmtDT(it.due))}"><span>${ICON[it.sr]}</span><span class="t">${L.hm(it.due)}</span><span class="n">${esc(shortName(it) || '')}</span><span class="s">${stxt(it, s)}</span></button>`; }).join('')}</div>`;
  }
  const n = ITEMS.filter((it) => ['ready', 'warn'].includes(stateOf(it, now))).length;
  document.title = (n ? `(${n}) ` : '') + 'CSA POSTS';
  $('#main').innerHTML = `
    <h2>✅ 今やること</h2><div id="todo">${T.map((t) => `<div class="task ${t.cls}" ${t.id ? `data-open="${esc(t.id)}"` : ''}><span class="ic">${t.ic}</span><div><div class="tt">${esc(t.tt)}</div>${t.sub ? `<div class="sub">${esc(t.sub)}</div>` : ''}</div>${t.go ? `<button class="btn ${t.cls === 'now' ? 'cy' : 'main'} go">${t.go} →</button>` : ''}</div>`).join('')}</div>
    <div class="calbar"><h2 style="margin:0">📅 カレンダー</h2><button class="chip" data-mv="-1">‹ 前の月</button><span class="ym">${VIEW.y}年${VIEW.m + 1}月</span><button class="chip" data-mv="1">次の月 ›</button><button class="chip" data-mv="0">今月</button>
      <div class="legend"><span><i style="background:var(--gold)"></i>未予約・待ち</span><span><i style="background:var(--cyan)"></i>今投稿できる</span><span><i style="background:var(--up)"></i>済み</span><span><i style="background:var(--dn)"></i>要修正</span><span>🗓 今日・今週の予定(9:30)</span><span>📈 発表後の値動き(発表65分後)</span><span>📊 週間記録(土曜10:00)</span></div></div>
    <div class="cal">${cells}</div>
    <p class="sub" style="color:var(--mut);font-size:12px;margin-top:10px">時刻はすべて日本時間。予定をクリックすると、画像と本文と投稿ボタンが開きます。<span class="kbd">←</span><span class="kbd">→</span> で前後の予定へ、<span class="kbd">Esc</span> で閉じる。</p>`;
  if (OPEN) modal(OPEN, true);
}

// ---------- 詳細(モーダル) ----------
const kind = (sr) => sr === 'daily' ? '予約' : '投稿';
async function modal(id, keep) {
  const it = ITEMS.find((x) => x.id === id); if (!it) return closeModal();
  if (!keep) OPENUPD = false;
  OPEN = id; $('#ov').classList.add('on');
  const now = Date.now(), s = stateOf(it, now), p = it.post, show = p && OPENUPD && p.upd ? { ...p, ...p.upd } : p, d = jd(it.due);
  const steps = AUTO(it) ? ['🤖 X API で自動投稿されます(画像つき)', '手で投稿しないでください', '投稿されると自動で「済み」になります']
    : it.sr === 'daily'
    ? ['画像をコピーしてXを開く', 'Ctrl+V で画像を貼る', `Xの📅で ${d.getUTCMonth() + 1}月${d.getUTCDate()}日 ${L.hm(it.due)} に予約`, '「予約済み」にチェック']
    : ['画像をコピーしてXを開く', 'Ctrl+V で画像を貼る', 'そのまま投稿', '「投稿済み」にチェック'];
  const idx = ITEMS.indexOf(it);
  $('#md').innerHTML = `
    <div class="mh"><span style="font-size:22px">${ICON[it.sr]}</span><span class="k">${LABEL[it.sr]}</span><span class="w">${esc(it.sr === 'arch' ? shortName(it) : fmtDT(it.due).split(' ')[0])}</span>
      <div class="x"><button class="chip" data-nav="${idx - 1}" ${idx > 0 ? '' : 'disabled'}>← 前</button><button class="chip" data-nav="${idx + 1}" ${idx < ITEMS.length - 1 ? '' : 'disabled'}>次 →</button><button class="chip" id="close">✕ 閉じる</button></div></div>
    <div class="when"><div class="calicon"><div class="m">${d.getUTCMonth() + 1}月</div><div class="d">${d.getUTCDate()}</div><div class="w">${WJA[d.getUTCDay()]}曜</div></div>
      <div><div class="lab">${kind(it.sr)}する日時(日本時間)</div><div class="big">${L.hm(it.due)}</div><div class="lab">${s === 'wait' ? '発表 ' + fmtDT(it.g[0].ts) + ' → ' + left(it.due - now) : s === 'ready' ? '今すぐ投稿できます' : s === 'done' ? '✔ 済み' : ''}</div></div>
      <div class="steps">${steps.map((t, i) => `<span class="step"><b>${'①②③④'[i]}</b>${esc(t)}</span>`).join('')}</div></div>
    ${p && p.upd ? `<div class="warnbox">⚠ 予約した後に予定が変わりました。Xで予約を削除して、新しい内容で予約し直してください。
      <button class="btn" id="showUpd">${OPENUPD ? '元の内容を見る' : '新しい内容を見る'}</button><button class="btn main" id="accept">新しい内容で予約し直した</button></div>` : ''}
    ${show ? `<div class="panes">${['en', 'ja'].map((lg) => pane(show, lg)).join('')}</div>`
      : `<div class="empty">${s === 'wait' ? `⏳ まだ発表前です。投稿時刻(${fmtDT(it.due)})になると、このページがBinanceから価格を取って下書きを作ります。` : s === 'ready' ? '価格を取得しています…(1分ほどで出ます)' : '下書きは作られませんでした。'}</div>`}`;
  if (show) for (const lg of ['en', 'ja']) image(show, lg).then((o) => { const el = $(`#md img[data-lg="${lg}"]`); if (el && o) el.src = o.url; }).catch((e) => console.error(e));
}
function pane(p, lg) {
  const n = L.xlen(p[lg]), on = p.done && p.done[lg], lab = p.sr === 'daily' ? '予約済み' : '投稿済み';
  return `<div class="pane" data-lg="${lg}">
    <div class="lang"><span>${lg === 'en' ? '① ENGLISH(先に)' : '② 日本語'}</span><span class="${n > 280 ? 'over' : ''}">${n}/280</span></div>
    <img alt="" data-lg="${lg}" draggable="true">
    <pre>${esc(p[lg])}</pre>
    <div class="btns">
      <button class="btn main" data-act="share">${MOBILE ? '画像つきで投稿' : '画像をコピーしてXを開く'}</button>
      <button class="btn" data-act="save">画像保存</button>
      <button class="btn" data-act="copy">文コピー</button>
      <label class="ck ${on ? 'on' : ''}"><input type="checkbox" data-act="done" ${on ? 'checked' : ''}>${on ? '✔ ' + lab : lab + 'にする'}</label>
    </div></div>`;
}
function closeModal() { OPEN = null; $('#ov').classList.remove('on'); }

// ---------- 操作 ----------
async function mark(id, lang, v) {
  const p = POSTS.find((x) => x.id === id); if (!p) return;
  p.done = p.done || {}; p.done[lang] = v ? Date.now() : 0;
  build(); render();
  try { await api({ mark: { id, lang, v } }); toast(v ? `${lang === 'en' ? '英語' : '日本語'}を${p.sr === 'daily' ? '予約済み' : '投稿済み'}にしました` : 'チェックを外しました'); }
  catch (e) { toast('保存できませんでした(' + e.message + ')'); }
}
document.addEventListener('click', async (ev) => {
  const o = ev.target.closest('[data-open]'); if (o && !ev.target.closest('#md')) return modal(o.dataset.open);
  const mv = ev.target.closest('[data-mv]');
  if (mv) { const k = +mv.dataset.mv; if (!k) VIEW = null; else { const d = new Date(Date.UTC(VIEW.y, VIEW.m + k, 1)); VIEW = { y: d.getUTCFullYear(), m: d.getUTCMonth() }; } return render(); }
  const nv = ev.target.closest('[data-nav]'); if (nv && !nv.disabled) { const it = ITEMS[+nv.dataset.nav]; if (it) modal(it.id); return; }
  if (ev.target.id === 'close' || ev.target.id === 'ov') return closeModal();
  if (ev.target.id === 'showUpd') { OPENUPD = !OPENUPD; return modal(OPEN, true); }
  if (ev.target.id === 'accept') { try { await api({ accept: OPEN }); const p = POSTS.find((x) => x.id === OPEN); Object.assign(p, p.upd); delete p.upd; OPENUPD = false; build(); render(); toast('新しい内容にしました'); } catch (e) { toast('保存できませんでした(' + e.message + ')'); } return; }
  const b = ev.target.closest('[data-act]'); if (!b || !OPEN) return;
  const it = ITEMS.find((x) => x.id === OPEN), p0 = it && it.post; if (!p0) return;
  const p = OPENUPD && p0.upd ? { ...p0, ...p0.upd } : p0, lg = b.closest('.pane').dataset.lg, text = p[lg], act = b.dataset.act;
  if (act === 'done') return mark(p0.id, lg, b.checked);
  if (act === 'copy') { try { await navigator.clipboard.writeText(text); toast('本文をコピーしました'); } catch (_) { toast('コピーできませんでした'); } return; }
  const im = await image(p, lg).catch(() => null);
  if (act === 'save') { if (!im) return toast('画像を作れませんでした'); const a = document.createElement('a'); a.href = im.url; a.download = im.name; a.click(); return; }
  if (act === 'share') {
    if (!im) return toast('画像を作れませんでした');
    if (MOBILE && navigator.canShare && navigator.canShare({ files: [im.file] })) {
      try { navigator.clipboard.writeText(text).catch(() => {}); } catch (_) {}
      try { await navigator.share({ files: [im.file], text }); toast('共有しました。投稿したら「済み」にチェック'); } catch (e) { if (e && e.name !== 'AbortError') toast('共有できませんでした(' + e.name + ')'); }
      return;
    }
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': im.blob })]); }
    catch (_) { toast('画像をコピーできませんでした。画像をXの投稿欄にドラッグしてください', 4500); window.open(intent(text), '_blank'); return; }
    window.open(intent(text), '_blank');
    toast(p.sr === 'daily' ? '画像をコピーしました → Ctrl+V → 📅で予約 → 戻って「予約済み」' : '画像をコピーしました → Ctrl+V → 投稿 → 戻って「投稿済み」', 5000);
  }
});
document.addEventListener('dragstart', (ev) => {   // 画像をXの投稿欄へドラッグして添付できるように
  const img = ev.target.closest && ev.target.closest('#md img'); if (!img || !OPEN) return;
  const it = ITEMS.find((x) => x.id === OPEN), lg = img.dataset.lg, o = it && it.post && IMG.get(it.post.id + ':' + lg + ':' + ((OPENUPD && it.post.upd ? it.post.upd.h : it.post.h) || ''));
  if (o) try { ev.dataTransfer.items.add(o.file); } catch (_) {}
});
document.addEventListener('keydown', (ev) => {
  if (!OPEN || ev.target.tagName === 'INPUT') return;
  if (ev.key === 'Escape') closeModal();
  const i = ITEMS.findIndex((x) => x.id === OPEN);
  if (ev.key === 'ArrowRight' && ITEMS[i + 1]) modal(ITEMS[i + 1].id);
  if (ev.key === 'ArrowLeft' && ITEMS[i - 1]) modal(ITEMS[i - 1].id);
});
$('#reload').onclick = load;
$('#keyBtn').onclick = () => { if (confirm('この端末に保存した管理キーを消して、入れ直しますか?')) { setKey(''); keyForm(); } };
const bellTxt = () => { $('#bell').textContent = !('Notification' in window) ? '🔕 通知は使えません' : Notification.permission === 'granted' ? '🔔 通知オン' : '🔔 通知をオンにする'; };
$('#bell').onclick = async () => { if ('Notification' in window) { await Notification.requestPermission(); bellTxt(); } };
bellTxt();

// ---------- 発表後の値動きを時刻どおりに作る(このタブが開いている間) ----------
const notified = new Set(), busy = new Set();
function notify(title, body, id) {
  if (notified.has(id)) return; notified.add(id);
  try { if ('Notification' in window && Notification.permission === 'granted') { const n = new Notification(title, { body, tag: id }); n.onclick = () => { window.focus(); modal(id); n.close(); }; } } catch (_) {}
}
async function klines(sym, interval, startTime, limit) {
  for (const base of BASES) { try { const r = await fetch(L.klinesUrl(base, sym, interval, startTime, limit), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (_) {} }
  return null;
}
async function tick() {
  if (!READY) return;
  const now = Date.now();
  for (const it of ITEMS) {
    if (it.sr !== 'arch' || it.post || busy.has(it.id) || it.due > now || now - it.due > 48 * L.H) continue;
    busy.add(it.id);
    try {
      const mv = {};   // v91: 4銘柄の1時間後(BTCは必須)
      await Promise.all(L.COINS.map(async ([c, sym]) => { const bars = await klines(sym, '5m', L.barsStart(it.g[0].ts), 25); mv[c] = bars && L.moves(bars, it.g[0].ts); }));
      if (mv.BTC) {
        const post = { at: now, ...L.archPost(it.g, mv, SITE) };
        await api({ add: [post] });
        POSTS.push({ ...post, done: { en: 0, ja: 0 } }); build(); render();
      }
    } catch (e) { console.error(e); }
    busy.delete(it.id);
  }
  for (const it of ITEMS) if (stateOf(it, now) === 'ready' && it.post) notify(`投稿の時間です: ${LABEL[it.sr]}`, it.sr === 'arch' ? shortName(it) : fmtDT(it.due), it.id);
  if (!OPEN) render(); else { const n = ITEMS.filter((x) => ['ready', 'warn'].includes(stateOf(x, now))).length; document.title = (n ? `(${n}) ` : '') + 'CSA POSTS'; }
}
// ---------- v101: 過去の発表から「発表後の値動き」を作る(手で投稿。自動投稿はしない) ----------
// 直近7日の日米欧の指標(重要度に関係なく。高を先に)から選ぶ → Binance の5分足で4銘柄の1時間後を作り、下書きに足す
function pastGroups() {
  const now = Date.now(), have = new Set(POSTS.map((p) => p.id));
  const ev = (RAWCAL.events || []).map((e) => ({ ...e, ts: Date.parse(e.at) })).filter((e) => e.l === 'macro' && L.REGIONS.includes(e.c) && isFinite(e.ts) && e.ts + L.ARCH_WAIT <= now && now - e.ts < 7 * L.DAY);
  return L.groups(ev).filter((g) => !have.has(L.archId(g))).sort((a, b) => (b.some((e) => e.im === 'high') - a.some((e) => e.im === 'high')) || b[0].ts - a[0].ts);
}
function pickPast() {
  const G = pastGroups();
  OPEN = '__past'; $('#ov').classList.add('on');
  $('#md').innerHTML = `<div class="mh"><span style="font-size:22px">📈</span><span class="k">過去の発表から作る</span><span class="w">直近7日・発表済み</span><div class="x"><button class="chip" id="pastClose">✕ 閉じる</button></div></div>
    <p style="color:var(--mut);margin:8px 0 14px">選ぶと、発表時点から1時間後までの4銘柄の値動き(Binance 現物)で下書きを作ります。<b>自動投稿はされません</b>。作ったあと、いつもどおり画像をコピーして手で投稿してください。</p>
    ${G.length ? G.map((g, i) => `<button class="task" data-pg="${i}" style="width:100%;text-align:left;cursor:pointer;color:var(--tx);font:inherit;margin-bottom:8px"><span class="ic">${g.some((e) => e.im === 'high') ? '🔴' : '⚪'}</span><div><div class="tt">${esc(L.groupLine(g, 'ja'))}</div><div class="sub">${esc(fmtDT(g[0].ts))}${g.some(L.MAJOR) ? ' · 主要指標' : ''}</div></div></button>`).join('') : '<div class="empty">作れる発表がありません(直近7日の発表は、すべて下書きがあります)</div>'}`;
  $('#pastClose').onclick = closeModal;
  $('#md').querySelectorAll('[data-pg]').forEach((b) => { b.onclick = async () => {
    const g = G[+b.dataset.pg]; b.disabled = true; toast('価格を取得しています…');
    try {
      const mv = {};
      await Promise.all(L.COINS.map(async ([c, sym]) => { const bars = await klines(sym, '5m', L.barsStart(g[0].ts), 25); mv[c] = bars && L.moves(bars, g[0].ts); }));
      if (!mv.BTC) { toast('Binance から価格が取れませんでした。少しして試してください'); b.disabled = false; return; }
      const post = { at: Date.now(), ...L.archPost(g, mv, SITE), man: 1 };
      await api({ add: [post] });
      POSTS.push({ ...post, done: { en: 0, ja: 0 } }); closeModal(); build(); render(); modal(post.id);
    } catch (e) { toast('作れませんでした: ' + e.message); b.disabled = false; }
  }; });
}
$('#pastBtn').onclick = () => { if (READY) pickPast(); };

load(); setInterval(tick, 30000);
setInterval(() => { if (!OPEN && getKey()) load(); }, 10 * 60000);   // 10分ごとに下書きを読み直す
</script>
</body>
</html>
