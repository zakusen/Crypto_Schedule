name: Apply update zip (zipを上げると自動で展開)

# リポジトリの直下(または updates/)に *.zip をアップロードすると、中身を展開して反映し、zipは消す。
# 秘密ファイル(.env など)は上書きしない。
# ワークフロー(.github/workflows)だけは GitHub の制限で自動反映できないので、手で上げる。
# 手で動かしたい時は Actions → この名前 → Run workflow。
on:
  push:
    paths:
      - "*.zip"
      - "updates/*.zip"
  workflow_dispatch:

concurrency:
  group: crypto-schedule-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and apply
        run: python3 tools/apply_update.py

      - name: Commit
        run: |
          git config user.name "crypto-schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "apply update zip $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
